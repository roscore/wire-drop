[package]
name = "wd_web"
description = "Browser front end for Wire Drop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
wd_core = { path = "../wd_core" }
wasm-bindgen = "=0.2.100"
js-sys = "0.3.77"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "Blob", "BlobPropertyBag", "CanvasRenderingContext2d", "CssStyleDeclaration", "Document",
  "DomRect", "DomTokenList", "Element", "Event", "EventTarget", "HtmlAnchorElement",
  "HtmlCanvasElement", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "KeyboardEvent",
  "MouseEvent", "NodeList", "Url", "Window",
]
